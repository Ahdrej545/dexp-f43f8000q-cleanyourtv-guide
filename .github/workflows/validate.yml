name: Validate repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Validate JSON, SVG, links and Bash syntax
        run: python3 scripts/validate_repo.py

  powershell-parse:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Parse PowerShell scripts without executing them
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/tv-menu.ps1",
            "scripts/inspect-tv.ps1"
          )
          $failed = $false
          foreach ($scriptPath in $scripts) {
            $tokens = $null
            $parseErrors = $null
            $fullPath = Join-Path $PWD $scriptPath
            [System.Management.Automation.Language.Parser]::ParseFile(
              $fullPath,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $parseErrors) {
                Write-Error ("{0}: {1} (line {2}, column {3})" -f $scriptPath, $parseError.Message, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber)
              }
            } else {
              Write-Host ("PowerShell syntax OK: {0}" -f $scriptPath)
            }
          }
          if ($failed) { exit 1 }
