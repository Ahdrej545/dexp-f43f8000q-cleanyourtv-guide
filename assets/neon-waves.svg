<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">CleanYourTV neon waves wallpaper</title>
  <desc id="desc">Minimalist dark navy background with cyan, blue, violet, magenta and green flowing neon curves.</desc>
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11e8ee" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#05f4f3"/>
      <stop offset="1" stop-color="#0aa1ef" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#654cff" stop-opacity=".45"/>
      <stop offset=".52" stop-color="#5c7dff"/>
      <stop offset="1" stop-color="#a83cff" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="1" y2=".1">
      <stop offset="0" stop-color="#8b40ff" stop-opacity=".65"/>
      <stop offset=".55" stop-color="#ff27be"/>
      <stop offset="1" stop-color="#b832ff" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c99a" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#00f5ba"/>
      <stop offset="1" stop-color="#00d9a0" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#13102b"/>
      <stop offset="1" stop-color="#03050d"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#ambient)"/>
